<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>Reset your ReadShelf password</title>
  <style>
    :root { color-scheme: light only; supported-color-schemes: light; }
    body, table, td, p, a, h1, h2 { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    @media (prefers-color-scheme: dark) {
      .email-bg, .email-bg table, .email-bg td { background-color: #FBF7F0 !important; }
      .email-card, .email-card > tbody > tr > td, .email-header, .email-content, .email-footer-cell { background-color: #F7F1E5 !important; }
      .email-title { color: #3C2A21 !important; }
      .email-brand { color: #634832 !important; }
      .email-text, .email-text p { color: #645C53 !important; }
      .email-muted { color: #8C7E72 !important; }
      .email-footer-text { color: #A09383 !important; }
      .email-code { background-color: #FBF7F0 !important; color: #3C2A21 !important; border-color: #EADBC8 !important; }
      .email-border { border-color: #EADBC8 !important; }
    }
    @media screen and (max-width: 520px) {
      .email-card { width: 100% !important; }
      .email-content { padding: 0 20px 25px 20px !important; }
    }
  </style>
</head>
<body class="email-bg" style="margin: 0; padding: 0; background-color: #FBF7F0 !important; color: #645C53 !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#FBF7F0" class="email-bg" style="width: 100%; background-color: #FBF7F0 !important; padding: 40px 10px;">
    <tr>
      <td align="center" bgcolor="#FBF7F0" style="background-color: #FBF7F0 !important;">
        <table role="presentation" width="500" cellspacing="0" cellpadding="0" border="0" bgcolor="#F7F1E5" class="email-card email-border" style="width: 100%; max-width: 500px; background-color: #F7F1E5 !important; border: 1px solid #EADBC8; border-radius: 12px; border-collapse: separate;">
          <tr>
            <td align="center" bgcolor="#F7F1E5" class="email-header" style="background-color: #F7F1E5 !important; padding: 35px 20px 20px 20px; text-align: center;">
              <img src="{{ .SiteURL }}/logo.png" alt="ReadShelf" width="56" style="display: block; margin: 0 auto 12px auto; max-width: 56px; height: auto;">
              <h2 class="email-brand" style="color: #634832 !important; font-size: 20px; margin: 0; font-family: Georgia, serif; font-weight: 600;">ReadShelf</h2>
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#F7F1E5" class="email-content email-text" style="background-color: #F7F1E5 !important; padding: 0 40px 30px 40px; text-align: center;">
              <h1 class="email-title" style="color: #3C2A21 !important; font-size: 22px; font-weight: 700; margin: 0 0 12px 0; font-family: Georgia, serif;">Reset your password</h1>
              <p style="color: #645C53 !important; font-size: 15px; line-height: 1.6; margin: 0 0 24px 0;">Use this code on the reset page to choose a new password.</p>
              <p class="email-code" style="display: inline-block; margin: 0 0 24px 0; padding: 16px 28px; background-color: #FBF7F0 !important; border: 1px solid #EADBC8; border-radius: 10px; font-size: 32px; font-weight: 700; letter-spacing: 0.28em; color: #3C2A21 !important; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">{{ .Token }}</p>
              <p class="email-muted" style="color: #8C7E72 !important; font-size: 13px; line-height: 1.6; margin: 0;">If you did not request a password reset, you can ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td align="center" bgcolor="#F7F1E5" class="email-footer-cell email-border" style="background-color: #F7F1E5 !important; padding: 0 40px 35px 40px; text-align: center; border-top: 1px solid #EADBC8;">
              <p class="email-footer-text" style="color: #A09383 !important; font-size: 12px; line-height: 1.5; margin: 15px 0 0 0;">ReadShelf. Your digital books, progress, and highlights in one place.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
